<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Mental Health Survey</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    height: 100vh;
    background: linear-gradient(-45deg,#ff9a9e,#fad0c4,#a18cd1,#fbc2eb);
    background-size: 400% 400%;
    animation: gradientBG 12s ease infinite;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

/* Gradient animation */
@keyframes gradientBG {
    0% { background-position:0% 50%; }
    50% { background-position:100% 50%; }
    100% { background-position:0% 50%; }
}

/* Floating shapes */
.shape {
    position: absolute;
    opacity: 0.25;
    animation: float 8s infinite ease-in-out;
}

.shape1 { width:60px; height:60px; background:white; top:10%; left:10%; border-radius:12px; }
.shape2 { width:90px; height:90px; background:#ffeb3b; bottom:15%; right:15%; border-radius:50%; }
.shape3 { width:45px; height:45px; background:#00e5ff; top:70%; left:20%; transform: rotate(45deg); }
.shape4 { width:120px; height:20px; background:white; top:30%; right:25%; }
.shape5 { width:55px; height:55px; background:#ff80ab; bottom:30%; left:40%; border-radius:50%; }

@keyframes float {
    0% { transform: translateY(0); }
    50% { transform: translateY(-30px); }
    100% { transform: translateY(0); }
}

/* Floating emojis */
.emoji {
    position: absolute;
    font-size: 36px;
    animation: emojiFloat 6s infinite ease-in-out;
}

.e1 { top:8%; right:12%; }
.e2 { bottom:12%; left:12%; }
.e3 { top:50%; right:5%; }
.e4 { bottom:40%; right:20%; }

@keyframes emojiFloat {
    0% { transform: translateY(0); }
    50% { transform: translateY(-25px); }
    100% { transform: translateY(0); }
}

/* Card */
.card {
    width: 620px;
    background: white;
    padding: 35px;
    border-radius: 25px;
    box-shadow: 0 20px 45px rgba(0,0,0,0.3);
    z-index: 10;
    animation: pop 0.7s ease;
}

@keyframes pop {
    from { opacity:0; transform: translateY(40px) scale(0.9); }
    to { opacity:1; transform: translateY(0) scale(1); }
}

h2 {
    text-align: center;
    color: #6a1bd1;
    margin-bottom: 10px;
}

/* Progress bar */
.progress {
    height: 12px;
    background: #e0e0e0;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 25px;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(to right,#6a1bd1,#ff758c);
    transition: width 0.5s ease;
}

/* Question */
.question {
    font-size: 22px;
    margin-bottom: 18px;
    animation: slideFade 0.5s ease;
}

@keyframes slideFade {
    from { opacity:0; transform: translateX(30px); }
    to { opacity:1; transform: translateX(0); }
}

/* Options */
.options label {
    display: block;
    padding: 14px;
    margin: 10px 0;
    border: 2px solid #ddd;
    border-radius: 16px;
    cursor: pointer;
    transition: 0.3s;
}

.options label:hover {
    background: #f4e9ff;
    border-color: #6a1bd1;
    transform: translateX(8px);
}

/* Button */
button {
    padding: 14px 45px;
    font-size: 17px;
    margin-top: 25px;
    background: linear-gradient(to right,#6a1bd1,#ff758c);
    color: white;
    border: none;
    border-radius: 18px;
    cursor: pointer;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
}
</style>
</head>

<body>

<!-- Floating shapes -->
<div class="shape shape1"></div>
<div class="shape shape2"></div>
<div class="shape shape3"></div>
<div class="shape shape4"></div>
<div class="shape shape5"></div>

<!-- Floating emojis -->
<div class="emoji e1">🧠</div>
<div class="emoji e2">🌿</div>
<div class="emoji e3">❤️</div>
<div class="emoji e4">🧘</div>
<div class="emoji e5">❤️‍🩹</div>

<!-- Survey Card -->
<div class="card">
    <h2 id="qno">Question 1 of 15</h2>

    <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="question" id="questionText"></div>
    <div class="options" id="options"></div>

    <button onclick="nextQuestion()">Next</button>
</div>

<script>
const questions = [
    "How often do you feel overwhelmed by the volume of your academic workload and assignments?",
    "How much pressure do you feel to consistently achieve high grades to meet expectations?",
    "How frequently do you find it difficult to manage your time between studies and personal life?",
    "To what extent do you worry about your future career prospects and post-graduation success?",
    "How often does the fear of failing an exam or assignment cause you significant anxiety?",
    "How much do you feel the weight of financial responsibilities or student debt while studying?",
    "How often do you experience a sense of loneliness or isolation during your university life?",
    "How much pressure do you feel to compare your academic progress with that of your peers?",
    "How frequently do your studies interfere with your ability to get a full night's restful sleep?",
    "How often do you feel physically or mentally drained by the constant demands of student life?"
];

const optionsList = [
    { text: "Very High", value: 5 },
    { text: "High", value: 4 },
    { text: "Medium", value: 3 },
    { text: "Low", value: 2 },
    { text: "Very Low", value: 1 }
];

let current = 0;
let answers = [];

function loadQuestion() {
    document.getElementById("qno").innerText =
        `Question ${current + 1} of ${questions.length}`;

    document.getElementById("questionText").innerText =
        questions[current];

    let html = "";
    for (let opt of optionsList) {
        html += `
            <label>
                <input type="radio" name="option" value="${opt.value}">
                ${opt.text}
            </label>
        `;
    }
    document.getElementById("options").innerHTML = html;

    let percent = ((current + 1) / questions.length) * 100;
    document.getElementById("progressBar").style.width = percent + "%";
}

function nextQuestion() {
    let selected = document.querySelector('input[name="option"]:checked');

    if (!selected) {
        alert("Please select an option");
        return;
    }

    answers.push(parseInt(selected.value));
    current++;

    if (current < questions.length) {
        loadQuestion();
    } else {
        fetch("/submit", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ answers: answers })
        }).then(response => {
            if (response.ok) {
                window.location.href = "/result";
            } else {
                console.error("Submission failed", response);
                window.location.href = "/result"; // Try to show results from session anyway
            }
        }).catch(err => {
            console.error("Network error on submission", err);
            window.location.href = "/result";
        });
    }
}

loadQuestion();
</script>

</body>
</html>
